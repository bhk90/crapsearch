<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Exa Web Search 自用搜索</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-3xl mx-auto space-y-6">
        <!-- 密钥设置区 -->
        <div class="bg-white p-4 rounded-xl shadow-sm flex gap-4 items-center">
            <input type="password" id="apiKey" placeholder="输入你的 EXA_API_KEY" 
                   class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="saveKey()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm">保存 Key</button>
        </div>

        <!-- 搜索主界面 -->
        <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h1 class="text-xl font-bold text-gray-800">Exa AI Search</h1>
            <div class="flex gap-2">
                <input type="text" id="queryInput" placeholder="输入搜索内容，例如：Latest news on Nvidia" 
                       class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="handleSearch()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">搜索</button>
            </div>
        </div>

        <!-- 结果展示区 -->
        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        // 自动加载本地保存的 Key
        document.getElementById('apiKey').value = localStorage.getItem('exa_key') || '';

        function saveKey() {
            const key = document.getElementById('apiKey').value.trim();
            localStorage.setItem('exa_key', key);
            alert('API Key 已保存至本地浏览器');
        }

        async function handleSearch() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const query = document.getElementById('queryInput').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!apiKey) {
                alert('请先填写并保存 Exa API Key！');
                return;
            }
            if (!query) return;

            resultsDiv.innerHTML = '<p class="text-gray-500 text-center">搜索中...</p>';

            try {
                // 调用 Exa REST API
                const response = await fetch('https://api.exa.ai/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey // 对应后台校验的 Header
                    },
                    body: JSON.stringify({
                        query: query,
                        num_results: 5,
                        type: 'lite',
                        contents: { highlights: true }
                    })
                });

                if (!response.ok) {
                    throw new Error(`请求失败: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                
                // 渲染结果
                resultsDiv.innerHTML = '';
                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<p class="text-gray-500">没有找到相关结果。</p>';
                    return;
                }

                data.results.forEach(item => {
                    let highlightsHtml = '';
                    if (item.highlights && item.highlights.length > 0) {
                        highlightsHtml = `<p class="text-sm text-gray-600 mt-1 bg-gray-50 p-2 rounded">...${item.highlights.join(' ... ')}...</p>`;
                    }

                    resultsDiv.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm space-y-1">
                            <a href="${item.url}" target="_blank" class="text-blue-600 font-medium hover:underline">${item.title || item.url}</a>
                            <p class="text-xs text-green-700">${item.url}</p>
                            ${highlightsHtml}
                        </div>
                    `;
                });

            } catch (error) {
                resultsDiv.innerHTML = `<p class="text-red-500">发生错误: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
